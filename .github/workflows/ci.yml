name: Stage 1 migration checks
on:
  push:
    branches: [main, migration/stage1-extraction]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Check Alembic migrations
        run: python -m alembic upgrade head
      - name: Test migrated character and rehearsal functionality
        run: python -m pytest -q tests/mvp/test_creator.py tests/mvp/test_rehearsal.py tests/mvp/test_rehearsal_format.py tests/mvp/test_rehearsal_attribution.py tests/mvp/test_rehearsal_quality.py tests/mvp/test_checkpoint_recovery.py tests/mvp/test_migrations.py tests/mvp/test_providers.py tests/mvp/test_marketplace.py tests/mvp/test_marketplace_scene.py

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build

  mobile-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Set up local Python test environment
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install -e ".[dev]"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install frontend
        working-directory: web
        run: npm ci
      - name: Install Playwright Chromium
        working-directory: web
        run: npx playwright install --with-deps chromium
      - name: Test Marketplace, characters, and rehearsal mobile flows
        working-directory: web
        run: npx playwright test e2e/marketplace.spec.ts e2e/editorial-ui.spec.ts e2e/mobile-characters.spec.ts e2e/rehearsal.spec.ts --reporter=line

      - name: Upload one-off character demo video
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: echoloom-character-demo-video
          path: web/test-results/Echoloom_Character_Demo.webm
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload editorial mobile screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: editorial-mobile-screens
          path: web/test-results/editorial-*.png
          if-no-files-found: ignore
          retention-days: 14
