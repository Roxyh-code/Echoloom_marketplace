name: Stage 1 migration checks
on:
  push:
    branches: [main, migration/stage1-extraction]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Check Alembic migrations
        run: python -m alembic upgrade head
      - name: Test migrated character and rehearsal functionality
        run: python -m pytest -q tests/mvp/test_creator.py tests/mvp/test_rehearsal.py tests/mvp/test_rehearsal_format.py tests/mvp/test_rehearsal_attribution.py tests/mvp/test_rehearsal_quality.py tests/mvp/test_checkpoint_recovery.py tests/mvp/test_migrations.py tests/mvp/test_providers.py

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
