name: Import reviewed README screenshots
on:
  push:
    branches: [docs/real-product-screenshots]
permissions:
  contents: write
  actions: read
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/real-product-screenshots
      - uses: actions/download-artifact@v4
        with:
          name: editorial-mobile-screens
          run-id: 46083665183
          github-token: ${{ github.token }}
          path: /tmp/echoloom-screens
      - name: Commit only reviewed screenshots and remove one-off workflow
        run: |
          set -euo pipefail
          mkdir -p docs/assets/screenshots
          for name in marketplace character-library character-creation story-reader; do
            cp "/tmp/echoloom-screens/editorial-$name.png" docs/assets/screenshots/
          done
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/assets/screenshots
          git rm .github/workflows/import-readme-screens.yml
          git commit -m "docs: add actual Playwright screenshots"
          git push origin HEAD:docs/real-product-screenshots
