name: Capture product gallery (one-time branch)
on:
  push:
    branches: [docs/product-gallery]
permissions:
  contents: read
jobs:
  capture:
    if: github.repository == 'Roxyh-code/Echoloom_marketplace' && github.ref == 'refs/heads/docs/product-gallery'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          python -m venv .venv
          .venv/bin/python -m pip install -e ".[dev]"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npx playwright install --with-deps chromium
        working-directory: web
      - name: Capture real product surfaces with test fixtures
        working-directory: web
        run: npx playwright test e2e/editorial-ui.spec.ts e2e/mobile-characters.spec.ts e2e/marketplace.spec.ts e2e/rehearsal.spec.ts --reporter=line
      - name: Upload screenshot evidence
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: product-gallery-screens
          path: web/test-results/editorial-*.png
      - name: Update only documentation screenshots on this branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          .venv/bin/python scripts/update_product_gallery.py --run-url "https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md docs/assets/screenshots/*.png
          # Remove the temporary write-capable workflow from the final PR.
          git rm .github/workflows/product-gallery-capture.yml
          git commit -m "docs: refresh product gallery with verified Playwright captures"
          gh auth setup-git
          git push origin HEAD:refs/heads/docs/product-gallery
